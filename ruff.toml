line-length = 120
target-version = "py312"
extend-exclude = [
    ".qa", "data", ".venv*", "node_modules", "frontend", "archivo", "reference", "design-source", "design_references",
    # Original desktop engines kept identical to their sources (see AGENTS.md).
    "backend/app/recopila_engine.py", "backend/app/organizador_engine.py", "backend/app/declara_engine.py",
    # Frozen migrations: applied revisions are not edited, not even for formatting.
    "backend/migrations", "backend/*_migrations",
]

[lint]
# Default rules (E4, E7, E9, F) plus bugbear and silent/blind exception handlers (plan, point 18).
extend-select = ["B", "BLE001", "S110"]
ignore = [
    "E712",  # SQLAlchemy column expressions require `== True/False`.
    "B008",  # FastAPI dependencies (Depends/File/Form) are declared as default arguments.
]

[lint.per-file-ignores]
# Pytest fixtures are imported from test_api and re-bound as parameters; tests prepare an isolated
# environment before importing the application.
"backend/tests/**" = ["F401", "F811", "F403", "F405", "E402"]
# Scripts adjust sys.path before importing the backend.
"scripts/**" = ["E402"]
# Routers are included after the app and its middleware exist; importing them at the top would
# create import cycles (they import app.main helpers).
"backend/app/main.py" = ["E402"]
"backend/app/integral_api.py" = ["E402"]

[format]
quote-style = "preserve"
